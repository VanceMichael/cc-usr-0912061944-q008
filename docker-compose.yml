services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/followup
      DATABASE_USER: followup
      DATABASE_PASSWORD: followup
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: followup, POSTGRES_PASSWORD: followup, POSTGRES_DB: followup}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followup"]
      interval: 2s
      timeout: 2s
      retries: 15
