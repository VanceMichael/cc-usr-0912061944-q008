services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ledger
      DATABASE_USER: ledger
      DATABASE_PASSWORD: ledger
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger, POSTGRES_DB: ledger}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 2s
      retries: 15
